<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradient obręczy i rączki: elektryczny cyjan do kobaltu/fioletu Jellyfin -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0082C8" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Gradient ptaszka: świecąca mięta do szmaragdu -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EFA8A" />
      <stop offset="100%" stop-color="#00D084" />
    </linearGradient>

    <!-- Subtelna poświata szklana wewnątrz soczewki -->
    <radialGradient id="glassGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0082C8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0082C8" stop-opacity="0.0" />
    </radialGradient>

    <!-- Cień dla czytelności na każdym tle (od białego po smolistą czerń) -->
    <filter id="iconShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <!-- Wnętrze soczewki (szkło z gradientem) -->
    <circle cx="50" cy="50" r="34" fill="url(#glassGlow)" />

    <!-- Obręcz lupy (gruba, wyrazista) -->
    <circle cx="50" cy="50" r="34" fill="none" stroke="url(#lensGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Rączka lupy -->
    <path d="M 75 75 L 106 106" stroke="url(#lensGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Ptaszek sukcesu (Checkmark) w centrum soczewki -->
    <path d="M 36 50 L 47 62 L 67 36" fill="none" stroke="url(#checkGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
